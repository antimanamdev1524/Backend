<!DOCTYPE html>

{% extends 'header.html' %}
{% load static %}
{% block content %}

<html lang="en">

    <section class="ftco-section contact-section bg-light pt-0 mt-n5 ">

      <div class="hero-wrap hero-bread">
        <div class="container">
        <div class="row block-9 justify-content-center">
          <div class="col-md-6 order-md-last d-flex">
           <form action="{% url 'verify_otp' %}" method="post"  enctype="multipart/form-data">
                {% csrf_token %}

              <div class="form-group">
                <label>Enter OTP</label>
                <input type="number" class="form-control" placeholder="Enter 6-digit  number here"name="otp" required>
              </div>

              <div class="form-group">
                <input type="submit" value="submit" class="btn btn-primary py-2 px-4">
              </div>
        {% if error %}
          <div class="alert alert-danger">
              {{ error }}
          </div>
        {% endif %}
              
             
            </form>
          
          </div>
        </div>
      </div>
    </div>
    </div>
    </section> 
   
    {% endblock %}
</html>
