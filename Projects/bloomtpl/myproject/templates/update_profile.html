<!DOCTYPE html>

{% extends 'header.html' %}
{% load static %}
{% block content %}

<html lang="en">
    <section class="ftco-section pt-0 mt-0" style="padding-top: 20px !important; margin-top: 0 !important;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-xl-8 ftco-animate">
            
				<form action="{% url 'update_profile' %}" method="post" class="billing-form" enctype="multipart/form-data">
                    {% csrf_token %}	

                        <div class= "profile-picture-container" style="text-align: center; margin-top: 20px; padding: 40px;">
                            {% if profile.profile_picture %}
                                <img src="{{ profile.profile_picture.url }}" id="view_profile" alt="Profile Picture" class="rounded-circle" width="50" height="50">
                            {% else %}
                                <img src="{% static 'images/default_profile_picture.jpg' %}" id="view_profile" alt="Default Profile Picture" class="rounded-circle" width="50" height="50">
                            {% endif %}

                            <div class="text d-block pl-md-5">
                                <div class="meta mb-3">   
                                    <div>     
                                        <div class="meta-chat" style="position: relative !important; top: -15px !important; display: inline-block;">
                                            <input type="file" id="profile-picture-input" onchange="handleProfilePictureChange(event)" name="profile_picture" style="display: none;">
                                            <i class="bi bi-pencil-fill" onclick="editProfile()"></i> 
                                            <script>
                                                function editProfile() 
                                                {
                                                    // Edit profile logic here
                                                    var i= document.getElementById('profile-picture-input');
                                                    console.log(i);
                                                    i.click();
                                                }

                                                function handleProfilePictureChange(event) 
                                                {
                                                    var file = event.target.files[0];
                                                    if (file) 
                                                    {
                                                        var reader = new FileReader();
                                                        reader.onload = function(e) 
                                                        {
                                                            document.getElementById('view_profile').src = e.target.result;
                                                        };
                                                        reader.readAsDataURL(file);
                                                    }
                                                }
                                            </script>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>


                     
                    <h6 class="mb-4 billing-heading">Personal Information:</h6>		
                    <div class="row align-items-end">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="firstname">First Name</label>
                                    <input type="text" class="form-control" name="first_name" value="{{ request.session.first_name|default:request.user.first_name }}">                
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="lastname">Last Name</label>
                                    <input type="text" class="form-control" name="last_name" value="{{ request.session.last_name|default:request.user.last_name}}">                
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="phone">Phone</label>
                                    <input type="tel" class="form-control" name="mobile" value="{{profile.mobile }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="emailaddress">Email Address</label>
                                    <input type="text" class="form-control" name="email" value="{{ request.session.email|default:request.user.email }}" readonly style="background-color: #f9f9f9; cursor: not-allowed;">                
                                </div>
                            </div>
                    </div>
                

                <br>
              
                    <h6 class="mb-4 billing-heading">Address Details:</h6>		
                    <div class="row align-items-end">              
                            <div class="w-100"></div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="country">Country</label>
                                    <div class="select-wrap">
                                        <div class="icon">
                                            <span class="ion-ios-arrow-down"></span>
                                        </div>
                                        <select name="country" id="country" class="form-control">
                                            <option value="India">India</option>
                                            <option value="Australia">Australia</option>
                                            <option value="Italy">Italy</option>
                                            <option value="Philippines">Philippines</option>
                                            <option value="South Korea">South Korea</option>
                                            <option value="Hongkong">Hongkong</option>
                                            <option value="Japan">Japan</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <div class="form-group">
                                        <label for="state">State</label>
                                        <div class="select-wrap">
                                            <div class="icon">
                                                <span class="ion-ios-arrow-down"></span>
                                            </div>

                                            <select name="state" id="state" class="form-control">
                                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                                <option value="Rajasthan">Rajasthan</option>
                                                <option value="Assam">Assam</option>
                                                <option value="Chhattisgarh">Chhattisgarh</option>
                                                <option value="Gujarat">Gujarat</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="district">District</label>
                                    <div class="select-wrap">
                                        <div class="icon">
                                            <span class="ion-ios-arrow-down"></span>
                                        </div>
                                        <select name="district" id="district" class="form-control">
                                            <option value="khargone">Khargone</option>
                                            <option value="Italy">Italy</option>
                                            <option value="Philippines">Philippines</option>
                                            <option value="South Korea">South Korea</option>
                                            <option value="Hongkong">Hongkong</option>
                                            <option value="Japan">Japan</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="towncity">Town / City</label>
                                    <input type="text" class="form-control" placeholder="" name="city" value="{{ request.session.city|default:address.city }}">
                                </div>
                            </div>

                            <div class="w-100"></div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="apartment">House / Apartment</label>
                                    <input type="text" class="form-control" placeholder="House number and building name" name="apartment" value="{{ request.session.apartment|default:address.apartment }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="streetaddress">Street Address</label>
                                    <input type="text" class="form-control" placeholder="Appartment, suite, unit etc: (optional)" name="street" value="{{ request.session.street|default:address.street }}">
                                </div>
                            </div>
                            <div class="w-100"></div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="pincodezip">Pincode / ZIP *</label>
                                    <input type="text" class="form-control" placeholder="" name="pincode" value="{{ request.session.pincode|default:address.pincode }}">
                                </div>
                            </div>
                            
                    </div>


                    <div class="mt-2 pt-2">
                            <div class="form-group">
                                <div class="checkbox">
                                    <label><input type="checkbox" value="" class="mr-2"> All above given information is correct</label><br>
                                </div>
                            </div>                           
                    </div>
                    
                    <p> <button class="btn btn-primary py-2 px-4">Submit Details</button></p> 
                    {% if msg %}
                        <div class="alert alert-success">
                            {{ msg }}
                        </div>
                    {% endif %}
                 </form><!-- END -->
                </div>
            </div> <!-- .col-md-8 -->
        </div>
      </div>
    </section> <!-- .section -->

    {% endblock %}
</html>
