<!DOCTYPE html>

{% extends 'header.html' %}
{% load static %}
{% block content %}

<html lang="en">

    <section class="ftco-section contact-section bg-light pt-0 mt-n5 ">

      <div class="hero-wrap hero-bread">
        <div class="container">
        <div class="row block-9 justify-content-center">
          <div class="col-md-6 order-md-last d-flex">
           <form action="{% url 'forgot_password' %}" method="post"  enctype="multipart/form-data">
                {% csrf_token %}
                
              <div class="row no-gutters slider-text align-items-center justify-content-center">
                     <div class="text-center">
                       <p class="mb-0 bread">Forgot Password?</p><br>
                     </div>
                </div>

              <div class="form-group">
                <label>Registered Email-Id</label>
                <input type="email" class="form-control" name="email" required>
              </div>

              {% comment %} <div class="form-group">
                Enter OTP<input type="password" class="form-control" name="new_password" required>
              </div> {% endcomment %}

              <div class="form-group">
                <input type="submit" value="Send OTP" class="btn btn-primary py-3 px-5">
              </div>
        {% if error %}
          <div class="alert alert-danger">
              {{ error }}
          </div>
        {% endif %}
              
             
            </form>
          
          </div>
        </div>
      </div>
    </div>
    </div>
    </section> 
   
    {% endblock %}
</html>
