<!DOCTYPE html>

{% extends 'header.html' %}
{% load static %}
{% block content %}

<html lang="en">

    <section class="ftco-section contact-section bg-light pt-0 mt-n5 ">

      <div class="hero-wrap hero-bread">
        <div class="container">
        <div class="row block-9 justify-content-center">
          <div class="col-md-6 order-md-last d-flex">
           <form action="{% url 'n_pass' %}" method="post"  enctype="multipart/form-data">
                {% csrf_token %}
                
              <div class="row no-gutters slider-text align-items-center justify-content-center">
                     <div class="text-center">
                       <p class="mb-0 bread">Create Password</p><br>
                     </div>
                </div>

              <div class="form-group">
                <div class="form-group">
                New Password:*<input type="password" class="form-control" name="new_password" required>
              </div>
              
              <div class="form-group">
                Confirm New Password:*<input type="password" class="form-control" name="confirm_new_password" required>
              </div>
              <div class="form-group">
                <input type="submit" value="update password" class="btn btn-primary py-3 px-5">
              </div>
        {% if error %}
          <div class="alert alert-danger">
              {{ error }}
          </div>
        {% endif %}
              
             
            </form>
          
          </div>
        </div>
      </div>
    </div>
    </div>
    </section> 
   
    {% endblock %}
</html>
