<!DOCTYPE html>
{%extends  'header.html' %}
{% load static %}
{% block content %}

<html lang="en">
  

    <div class="hero-wrap hero-bread" style="background-image: url('{% static 'images/bg_6.jpg' %}');">
      <div class="container">
        <div class="row no-gutters slider-text align-items-center justify-content-center">
          <div class="col-md-9 ftco-animate text-center">
          	<p class="breadcrumbs"><span class="mr-2"><a href="index.html">Home</a></span> <span>Change Password</span></p>
            <h1 class="mb-0 bread">Forgot Password</h1>
          </div>
        </div>
      </div>
    </div>

    
        
        {% if msg %}
        <div class="alert alert-danger" role="alert">
            {{msg}}
        </div>
        {% endif %}

        <div class="row block-9">
          <div class="col-md-6 order-md-last d-flex">


            <form class="bg-white p-5 contact-form" method= "POST" action="{% url 'OTP' %}">
              
              {% csrf_token %}

                          
              <div class="form-group">
                <input type="number" class="form-control" placeholder="Enter 4-Digit OTP" name= "uotp">
  
              </div>

              <div class="form-group">
                <input type="submit" value="Submit OTP" class="btn btn-primary py-3 px-5">
              </div>
            </form>
          
          </div>

          <div class="col-md-6 d-flex">
          	<div id="map" class="bg-white"></div>
          </div>
        </div>
      </div>
    </section> 
    {% endblock %}
</html>
